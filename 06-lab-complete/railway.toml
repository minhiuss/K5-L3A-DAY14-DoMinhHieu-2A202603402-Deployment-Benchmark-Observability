# ============================================================
# Cấu hình deploy Railway (tiêu chí 12)
#   Railway build bằng Dockerfile; PORT do Railway cấp, CMD trong Dockerfile đã đọc ${PORT:-8000}.
#   Biến AGENT_API_KEY, REDIS_URL đặt trên dashboard Railway (Variables), KHÔNG ghi ở đây.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
