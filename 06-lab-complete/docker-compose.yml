# ============================================================
# agent + redis bằng một lệnh: docker compose up --build   (tiêu chí 2)
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      REDIS_URL: redis://redis:6379/0      # "redis" = tên service bên dưới (DNS nội bộ của compose)
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-key}   # chỉ để chạy local; cloud đặt key thật trên dashboard
    depends_on:
      redis:
        condition: service_healthy   # chờ redis trả PONG rồi mới bật agent
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data             # restart không mất bộ đếm rate limit / chi phí

volumes:
  redis_data:
